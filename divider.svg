<svg width="900" height="6" viewBox="0 0 900 6" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="aurora" x1="0%" y1="0%" x2="100%" y2="0%" gradientUnits="userSpaceOnUse">
    <stop offset="0%"   stop-color="#000000" stop-opacity="0"/>
    <stop offset="10%"  stop-color="#e91e8c"/>
    <stop offset="30%"  stop-color="#9333ea"/>
    <stop offset="50%"  stop-color="#22d3ee"/>
    <stop offset="70%"  stop-color="#10b981"/>
    <stop offset="85%"  stop-color="#fbbf24"/>
    <stop offset="92%"  stop-color="#e91e8c"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    <animate attributeName="x1" values="0%;-100%;0%"   dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="100%;200%;100%" dur="4s" repeatCount="indefinite"/>
  </linearGradient>
  <filter id="glow">
    <feGaussianBlur stdDeviation="1.5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect width="900" height="6" fill="#000000"/>
<rect width="900" height="3" y="1.5" fill="url(#aurora)" filter="url(#glow)" opacity="0.9">
  <animate attributeName="opacity" values="0.7;1.0;0.7" dur="3s" repeatCount="indefinite"/>
</rect>
</svg>
