name: 📊 Update Stats Cards

on:
  schedule:
    - cron: "0 6 * * *"      # Daily 6 AM UTC
  workflow_dispatch:            # Manual trigger
  push:
    branches: [main]

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Stats Card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: >-
            username=${{ github.repository_owner }}
            &show_icons=true
            &hide_border=true
            &border_radius=12
            &bg_color=000000
            &title_color=e879f9
            &icon_color=22d3ee
            &text_color=a78bfa
            &ring_color=9333ea
            &include_all_commits=true
            &count_private=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Top Languages Card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: >-
            username=${{ github.repository_owner }}
            &layout=compact
            &hide_border=true
            &border_radius=12
            &bg_color=000000
            &title_color=22d3ee
            &text_color=a78bfa
            &langs_count=6
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/
          git diff --staged --quiet || git commit -m "chore: update stats cards [skip ci]"
          git push
